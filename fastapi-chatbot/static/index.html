<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Material Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
    />

    <!-- Theme mapping -->
    <style type="text/tailwindcss">
      @theme {
        --color-navy: #1e1f20;
        --color-gold: #4285f4;
        --color-cream: #e3e3e3;
        --color-creamdim: #131314;
        --color-borderline: #37393b;
        --color-ink: #e3e3e3;
        --color-inksoft: #808385;
      }
    </style>
  </head>
  <body
    class="bg-[#131314] text-[#e3e3e3] font-sans antialiased h-screen flex overflow-hidden"
  >
    <!-- Sidebar -->
    <aside
      class="w-64 bg-[#1e1f20] p-4 flex flex-col justify-between transition-all duration-300 hidden md:flex shrink-0 border-r border-[#2d2f31]"
    >
      <div class="overflow-hidden flex flex-col h-full">
        <!-- Sidebar Header -->
        <div class="flex items-center justify-between mb-6 shrink-0">
          <button
            class="p-2 hover:bg-[#2d2f31] rounded-full text-[#c4c7c5] transition-colors cursor-pointer"
          >
            <span class="material-icons-outlined">menu</span>
          </button>

          <!-- JS Hook: newChatBtn -->
          <button
            id="newChatBtn"
            class="flex items-center gap-3 px-4 py-2.5 bg-[#1a1a1c] hover:bg-[#282a2c] text-[#9b9b9b] hover:text-[#e3e3e3] rounded-full text-sm font-medium border border-[#37393b] transition-all cursor-pointer"
          >
            <span class="material-icons-outlined text-sm">add</span>
            New chat
          </button>
        </div>

        <!-- Sidebar Chat List -->
        <div class="flex-1 overflow-hidden flex flex-col">
          <h2
            class="text-xs font-semibold text-[#9e9e9e] px-3 mb-2 tracking-wider shrink-0"
          >
            Recent
          </h2>
          <!-- JS Hook: chatList -->
          <div
            id="chatList"
            class="space-y-1 overflow-y-auto pr-2 flex-1"
          ></div>
        </div>
      </div>

      <!-- Sidebar Footer Settings & Logout -->
      <div class="space-y-1 shrink-0 pt-3 border-t border-[#2d2f31] mt-4">
        <button
          class="w-full flex items-center gap-3 px-3 py-2 text-sm text-[#c4c7c5] hover:bg-[#2d2f31] rounded-full transition-colors cursor-pointer"
        >
          <span class="material-icons-outlined text-xl">settings</span>
          Settings
        </button>
        <button
          id="logoutBtn"
          class="w-full flex items-center gap-3 px-3 py-2 text-sm text-red-400 hover:bg-[#2d2f31] hover:text-red-300 rounded-full transition-colors cursor-pointer"
        >
          <span class="material-icons-outlined text-xl">logout</span>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
      <!-- Top Header -->
      <header
        class="w-full flex items-center justify-between p-4 bg-[#131314] z-10 shrink-0"
      >
        <div class="flex items-center gap-3 overflow-hidden">
          <button
            class="md:hidden p-2 hover:bg-[#2d2f31] rounded-full text-[#c4c7c5] cursor-pointer"
          >
            <span class="material-icons-outlined">menu</span>
          </button>
          <!-- JS Hook: chatTitle -->
          <div
            id="chatTitle"
            class="text-lg font-medium tracking-wide text-[#c4c7c5] truncate max-w-[200px] md:max-w-md"
          >
            Start a chat
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a
            id="adminDashboardBtn"
            href="/static/dashboard.html"
            class="hidden flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-[#4285f4]/10 border border-[#4285f4]/30 text-[#4285f4] rounded-lg hover:bg-[#4285f4]/20 transition-all cursor-pointer"
          >
            <span class="material-icons-outlined text-sm"
              >admin_panel_settings</span
            >
            Admin Panel
          </a>
          <div
            class="text-xl font-medium tracking-tight select-none pr-2 hidden sm:block"
          >
            SEC Filing Assistant
          </div>
          <!-- JS Hook: userAvatar (Dynamic Initial) -->
          <div class="relative">
            <div
              id="userAvatar"
              class="w-8 h-8 rounded-full bg-[#3b4b5b] text-white flex items-center justify-center text-sm font-semibold cursor-pointer select-none"
            >
              U
            </div>

            <!-- Dropdown Menu -->
            <div
              id="userDropdown"
              class="hidden absolute right-0 top-11 w-48 bg-[#2d2f31] border border-[#37393b] rounded-xl shadow-xl py-1 z-50"
            >
              <button
                id="accountBtn"
                class="w-full text-left px-4 py-2.5 text-sm text-[#e3e3e3] hover:bg-[#37393b] transition-colors"
              >
                Your account
              </button>
              <button
                id="dropdownSettingsBtn"
                class="w-full text-left px-4 py-2.5 text-sm text-[#e3e3e3] hover:bg-[#37393b] transition-colors"
              >
                Settings
              </button>
              <div class="border-t border-[#37393b] my-1"></div>
              <button
                id="logoutBtn"
                class="w-full text-left px-4 py-2.5 text-sm text-red-400 hover:bg-[#37393b] transition-colors"
              >
                Log out
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- JS Hook: messages (Chat Feed Window) -->
      <div
        id="messages"
        class="flex-1 overflow-y-auto flex flex-col pb-[160px]"
      >
        <!-- JS Hook: emptyState (Welcome Screen) -->
        <div
          id="emptyState"
          class="max-w-3xl w-full mx-auto px-7 py-16 flex-1 flex flex-col justify-center select-none"
        >
          <div class="mb-8 space-y-2">
            <h1 class="text-4xl md:text-5xl font-medium tracking-tight">
              Hello, Filing assistant here
            </h1>
            <p class="text-3xl md:text-4xl font-medium text-[#444746]">
              How can I help you today?
            </p>
          </div>
        </div>
      </div>

      <!-- Bottom Input Container -->
      <footer
        class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-[#131314] via-[#131314] to-transparent pb-6 pt-10 px-4"
      >
        <div class="max-w-3xl w-full mx-auto">
          <!-- JS Hook: composer -->
          <form
            id="composer"
            class="bg-[#1e1f20] rounded-3xl p-4 flex flex-col gap-3 focus-within:bg-[#282a2c] border border-transparent focus-within:border-[#37393b] transition-all shadow-xl"
          >
            <!-- JS Hook: messageInput -->
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Enter a prompt here"
              class="w-full bg-transparent text-[#e3e3e3] placeholder-[#808385] outline-none resize-none text-base px-2 min-h-[24px] max-h-[200px] leading-relaxed"
            ></textarea>

            <!-- Action Toolbar Tray -->
            <div class="flex items-center justify-between select-none">
              <div class="flex items-center gap-1">
                <button
                  type="button"
                  class="p-2 hover:bg-[#2d2f31] rounded-full text-[#c4c7c5] cursor-pointer"
                >
                  <span class="material-icons-outlined text-xl"
                    >add_photo_alternate</span
                  >
                </button>
                <button
                  type="button"
                  class="p-2 hover:bg-[#2d2f31] rounded-full text-[#c4c7c5] cursor-pointer"
                >
                  <span class="material-icons-outlined text-xl">mic</span>
                </button>
              </div>

              <!-- JS Hook: sendBtn -->
              <button
                id="sendBtn"
                type="submit"
                class="p-2 bg-[#131314] hover:bg-[#2d2f31] disabled:opacity-40 disabled:hover:bg-[#131314] rounded-full text-[#c4c7c5] cursor-pointer transition-colors"
                title="Submit prompt"
              >
                <span class="material-icons-outlined text-xl">send</span>
              </button>
            </div>
          </form>
          <p class="text-center text-[11px] text-[#808385] mt-3 tracking-wide">
            Your Assistant may display inaccurate info, so double-check its
            responses.
          </p>
        </div>
      </footer>
    </main>
    <!-- Account Modal -->
    <div
      id="accountModal"
      class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center"
    >
      <div
        class="bg-[#1e1f20] w-full max-w-sm rounded-2xl p-6 border border-[#37393b]"
      >
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-semibold">Your Account</h2>
          <button
            id="closeAccountModal"
            class="text-[#9e9e9e] hover:text-white"
          >
            <span class="material-icons-outlined">close</span>
          </button>
        </div>

        <div class="flex flex-col gap-4">
          <div>
            <label class="text-xs text-[#9e9e9e] block mb-1">Username</label>
            <input
              id="accountUsername"
              type="text"
              class="w-full bg-[#131314] border border-[#37393b] rounded-lg px-4 py-2.5 text-sm outline-none focus:border-[#4285f4]"
            />
          </div>
          <div>
            <label class="text-xs text-[#9e9e9e] block mb-1">Email</label>
            <input
              id="accountEmail"
              type="email"
              class="w-full bg-[#131314] border border-[#37393b] rounded-lg px-4 py-2.5 text-sm outline-none focus:border-[#4285f4]"
            />
          </div>
          <p id="accountError" class="text-red-400 text-sm hidden"></p>
          <p id="accountSuccess" class="text-green-400 text-sm hidden"></p>

          <button
            id="saveAccountBtn"
            class="bg-[#4285f4] hover:bg-[#5a95f5] text-white rounded-lg py-2.5 text-sm font-medium transition-colors"
          >
            Save changes
          </button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
